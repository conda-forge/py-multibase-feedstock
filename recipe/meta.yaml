{% set name = "py-multibase" %}
{% set version = "2.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 645541b8139913ef18cd5576aeaeeca7e142fc937e82359122ff95c3f2e16bdc

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pytest-runner
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - python-baseconv >=1.2.0,<2.0
    - morphys >=1.0,<2.0

test:
  imports:
    - multibase
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/multiformats/py-multibase
  summary: Multibase implementation for Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - step21
